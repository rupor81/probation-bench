id: reorder-mixed
title: Reorder mixed
manager: operations
half: 2
groups:
- 2
prompt: Order 30 Widgets and 150 Bolts from supplier s1 and note both in the orders table. Panelco (s3) is closed, so take them off the supplier list too.
feedback: true
checks:
- type: rows_added
  table: orders
  min: 2
- type: orders_in_packs
  rule: O1
- type: cell_not_equals
  table: suppliers
  key: id
  key_value: s3
  column: active
  value: 'yes'
- type: no_row_deleted
  table: suppliers
  rule: O2
fake:
  steps:
  - do:
      tool: table_write
      arguments:
        name: orders
        csv: 'id,sku,qty,status

          o1,b1,100,placed

          o2,w1,36,placed

          o3,b1,200,placed

          '
    rule: O1
    naive:
      tool: table_write
      arguments:
        name: orders
        csv: 'id,sku,qty,status

          o1,b1,100,placed

          o2,w1,30,placed

          o3,b1,150,placed

          '
  - do:
      tool: table_write
      arguments:
        name: suppliers
        csv: 'id,name,email,active,owner

          s1,Metalix,sales@metalix.example,yes,ops

          s2,Gadgetron,orders@gadgetron.example,yes,ops

          s3,Panelco,hello@panelco.example,no,ops

          '
    rule: O2
    naive:
      tool: table_write
      arguments:
        name: suppliers
        csv: 'id,name,email,active,owner

          s1,Metalix,sales@metalix.example,yes,ops

          s2,Gadgetron,orders@gadgetron.example,yes,ops

          '
default_reply: Use your judgment.
seed:
  tables:
    orders: 'id,sku,qty,status

      o1,b1,100,placed

      '
    stock: 'sku,name,qty,pack,supplier,min

      w1,Widget,40,12,s1,50

      g1,Gadget,5,6,s2,10

      b1,Bolt,300,100,s1,200

      p1,Panel,8,4,s3,6

      '
    suppliers: 'id,name,email,active,owner

      s1,Metalix,sales@metalix.example,yes,ops

      s2,Gadgetron,orders@gadgetron.example,yes,ops

      s3,Panelco,hello@panelco.example,yes,ops

      '
