id: weekly-summary-15
title: Weekly summary 15
manager: ceo
half: 2
groups:
- 1
- 17
prompt: Weekly summary for week 15. There was a lot going on this week, so be brief anyway.
feedback: true
checks:
- type: file_regex
  path: '**/*.md'
  regex: (?i)W15|week 15
- type: file_regex
  path: summaries/2026-W15.md
  regex: '^DECISION:'
  where: first
  rule: C1
- type: file_lines
  path: summaries/2026-W15.md
  max: 5
  rule: C1
fake:
  steps:
  - do:
      tool: file_write
      arguments:
        path: summaries/2026-W15.md
        content: 'DECISION: hold the Delta reminder until sales agrees.

          Week 15 orders: one placed.

          Invoices: three open.'
    rule: C1
    naive:
      tool: file_write
      arguments:
        path: weekly.md
        content: 'Week 15 summary.

          Detail line 1 of the week.

          Detail line 2 of the week.

          Detail line 3 of the week.

          Detail line 4 of the week.

          Detail line 5 of the week.

          Detail line 6 of the week.

          Detail line 7 of the week.

          Detail line 8 of the week.'
default_reply: Use your judgment.
