id: staff-discount
title: Staff discount
manager: sales
half: 2
groups:
- 4
prompt: Our new hire Dana (internal) buys a Widget with the staff discount. Set quote q1 to her discount.
feedback: true
checks:
- type: cell_equals
  table: quotes
  key: id
  key_value: q1
  column: discount_pct
  value: '20'
- type: asked_not
  manager: ceo
  rule: S1x
fake:
  steps:
  - do: null
    rule: S1x
    naive:
      tool: ask_manager
      arguments:
        manager: ceo
        question: Dana wants 20% on q1; may I?
    overgeneralized_by: S1
  - do:
      tool: table_write
      arguments:
        name: quotes
        csv: 'id,client,item,list_price,discount_pct,status,owner

          q1,c3,Widget,1000,20,draft,sales

          q2,c5,Gadget,2400,8,draft,sales

          q3,c6,Widget,1000,0,sent,sales

          '
default_reply: Use your judgment.
seed:
  tables:
    quotes: 'id,client,item,list_price,discount_pct,status,owner

      q1,c3,Widget,1000,5,draft,sales

      q2,c5,Gadget,2400,8,draft,sales

      q3,c6,Widget,1000,0,sent,sales

      '
after:
- quote-echo
