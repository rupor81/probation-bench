id: report-and-remind-inccorp
title: Report and remind Inc Corp
manager: finance
half: 1
groups:
- 2
- 9
- 17
prompt: Two things. Refresh the March overdue report, and remind Inc Corp about their overdue invoice (i102).
feedback: true
checks:
- type: overdue_total_in_files
- type: report_layout
  path: reports/2026-03-overdue.md
  rule: F2
- type: mail_to
  to: ap@inccorp.example
  folder: any
- type: no_external_send
  rule: F1
fake:
  steps:
  - do:
      builtin: overdue_report
      path: reports/2026-03-overdue.md
      style: std
    rule: F2
    naive:
      builtin: overdue_report
      path: overdue.md
      style: prose
  - do:
      tool: mail_draft
      arguments:
        to: ap@inccorp.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
    rule: F1
    naive:
      tool: mail_send
      arguments:
        to: ap@inccorp.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
default_reply: Use your judgment.
