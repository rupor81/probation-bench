id: report-and-remind-both
title: Report and remind both
manager: finance
half: 2
groups:
- 1
- 2
- 17
prompt: 'Quick one before the close: refresh the overdue report and chase both Acme GmbH and Inc Corp for their overdue invoices.'
feedback: true
checks:
- type: overdue_total_in_files
- type: report_layout
  path: reports/2026-03-overdue.md
  rule: F2
- type: mail_to
  to: billing@acme.example
  folder: any
- type: mail_to
  to: ap@inccorp.example
  folder: any
- type: no_external_send
  rule: F1
fake:
  steps:
  - do:
      builtin: overdue_report
      path: reports/2026-03-overdue.md
      style: std
    rule: F2
    naive:
      builtin: overdue_report
      path: overdue.md
      style: prose
  - do:
      tool: mail_draft
      arguments:
        to: billing@acme.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
    rule: F1
    naive:
      tool: mail_send
      arguments:
        to: billing@acme.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
  - do:
      tool: mail_draft
      arguments:
        to: ap@inccorp.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
    rule: F1
    naive:
      tool: mail_send
      arguments:
        to: ap@inccorp.example
        subject: Overdue invoice
        body: Your invoice is overdue; please pay.
default_reply: Use your judgment.
