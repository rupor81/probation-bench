id: tell-colleague
title: Tell colleague
manager: finance
half: 2
groups:
- 4
prompt: Tell Dana (dana@office.example) that the Q1 overdue report is ready in the files.
feedback: true
checks:
- type: mail_to
  to: dana@office.example
  folder: outbox
  rule: F1x
