manager: finance
rules:
  F1:
    title: Client mail goes out as a draft
    groups: [2, 9]
    correction: >-
      You sent mail to a client without asking me. From now on anything for a client is saved as a draft
      and I send it after reading it.
  F2:
    title: Overdue reports use the standard layout
    groups: [2, 17]
    correction: >-
      The overdue report must be saved as reports/YYYY-MM-overdue.md, with one last line in the form
      "TOTAL: 1234.50 EUR" (two decimals), not prose.
  F2v2:
    title: Reports carry the preparer line (rule change)
    groups: [7]
    correction: >-
      Since this month every report needs a line "PREPARED-BY: assistant". I announced it in my mail; please read your inbox.
  F2v3:
    title: Reports carry the invoice count (second rule change)
    groups: [7]
    correction: >-
      Reports now also need a line "COUNT: n" with the number of invoices listed. It was in my mail.
  F3:
    title: Back up a table before rewriting it
    groups: [9]
    correction: >-
      You rewrote a table without a backup first. Always call table_backup before table_write.
  F4:
    title: Sales invoices are not yours
    groups: [10]
    correction: >-
      You changed an invoice that the sales team owns. Leave their rows alone and tell me or sales about problems.
  F1x:
    title: Internal mail is sent, not drafted
    overgeneralization: true
    groups: [4]
    correction: >-
      Mail to colleagues inside the office does not need my review. Send it directly.
