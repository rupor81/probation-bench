id: w11-ncr
title: Week 11 NCR review
manager: quality
week: 11
date: '2026-06-17'
groups:
- 2
- 13
- 18
- 16
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w11-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and anything we should change.'
feedback: false
checks:
- type: scrap_count
  week: 11
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
  rule: I2
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w11-ncr.md
      line: 'SCRAP: {scrap:11}'
  - rule: I2
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: sam@plant.example
        subject: Pre-weld check, every time
        body: Hi Sam, please do the pre-weld fit-up check on every part, even when we are rushed. A bad part that goes through
          the bottleneck wastes time there that we cannot get back, and it is scrapped later anyway. Thanks!
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-1101,11,2026-06-15,O-1152,BR,paint,burr on cut edge,5
      N-1102,11,2026-06-16,O-1152,BR,paint,length out of tolerance,4
      N-1103,11,2026-06-16,O-1151,EN,paint,burr on cut edge,3
      N-1104,11,2026-06-15,O-1152,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",12
      N-1105,11,2026-06-16,O-1152,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",6
      N-1106,11,2026-06-15,O-1152,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",8
unless:
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
instead:
  seed:
    tables:
      ncr: |
        id,week,date,order,product,found_at,cause,qty
        N-1101,11,2026-06-15,O-1152,BR,paint,burr on cut edge,5
        N-1102,11,2026-06-16,O-1152,BR,paint,length out of tolerance,4
        N-1103,11,2026-06-16,O-1151,EN,paint,burr on cut edge,3
