id: w08-oven
title: Week 8 oven case
manager: finance
week: 8
date: '2026-05-28'
groups:
- 2
- 11
- 13
prompt: 'Finance. A faster curing oven would cut painting time by 20% for every product, for a lease of EUR 700 a week. The
  standard-cost sheet says it raises unit cost. Should we take it? Write plans/2026-w08-oven.md with a line DECISION: yes
  or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w08-oven.md
- type: file_regex
  path: plans/2026-w08-oven.md
  regex: (?i)DECISION:\s*\**\s*yes\b
  rule: T8
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w08-oven.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T8
    do:
      builtin: doc
      line: 'DECISION: yes'
    naive:
      builtin: doc
      line: 'DECISION: no'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: investment
