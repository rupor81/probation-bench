id: w12-tamsin-price
title: Week 12 tamsin-price case
manager: sales
week: 12
date: '2026-06-25'
groups:
- 2
- 11
- 13
prompt: 'Sales. Tamsin Tools would take 2,000 clips at 2.50 each; we list them at 9. Plenty of spare capacity in cutting and
  assembly. Should we take the order? Write plans/2026-w12-tamsin-price.md with a line DECISION: yes or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w12-tamsin-price.md
- type: file_regex
  path: plans/2026-w12-tamsin-price.md
  regex: (?i)DECISION:\s*\**\s*no\b
  rule: T11
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w12-tamsin-price.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T11
    do:
      builtin: doc
      line: 'DECISION: no'
    naive:
      builtin: doc
      line: 'DECISION: yes'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: pricing
