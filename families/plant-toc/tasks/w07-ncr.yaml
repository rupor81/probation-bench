id: w07-ncr
title: Week 7 NCR review
manager: quality
week: 7
date: '2026-05-20'
groups:
- 2
- 13
- 18
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w07-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and a line INSPECT-BEFORE: <work centre> saying where we add the next inspection point.'
feedback: true
checks:
- type: scrap_count
  week: 7
- type: labelled_centre
  label: INSPECT-BEFORE
  rule: T7
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
  rule: I2
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w07-ncr.md
      line: 'SCRAP: {scrap:7}'
  - rule: T7
    fact: paint
    do:
      builtin: doc
      line: 'INSPECT-BEFORE: {constraint}'
    naive:
      builtin: doc
      line: 'INSPECT-BEFORE: assy'
    stale:
      builtin: doc
      line: 'INSPECT-BEFORE: weld'
  - rule: I2
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: sam@plant.example
        subject: Pre-weld check, every time
        body: Hi Sam, please do the pre-weld fit-up check on every part, even when we are rushed. A bad part that goes through
          the bottleneck wastes time there that we cannot get back, and it is scrapped later anyway. Thanks!
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-0701,7,2026-05-18,O-0752,FR,paint,paint run,9
      N-0702,7,2026-05-19,O-0753,FR,paint,burr on cut edge,5
      N-0703,7,2026-05-18,O-0751,EN,paint,paint run,2
      N-0704,7,2026-05-19,O-0752,FR,paint,length out of tolerance,6
      N-0705,7,2026-05-19,O-0753,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",11
      N-0706,7,2026-05-19,O-0753,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",9
      N-0707,7,2026-05-19,O-0753,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",8
unless:
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
instead:
  seed:
    tables:
      ncr: |
        id,week,date,order,product,found_at,cause,qty
        N-0701,7,2026-05-18,O-0752,FR,paint,paint run,9
        N-0702,7,2026-05-19,O-0753,FR,paint,burr on cut edge,5
        N-0703,7,2026-05-18,O-0751,EN,paint,paint run,2
        N-0704,7,2026-05-19,O-0752,FR,paint,length out of tolerance,6
