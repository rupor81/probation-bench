id: w06-weld-cell
title: Week 6 weld-cell case
manager: finance
week: 6
date: '2026-05-14'
groups:
- 2
- 11
- 13
prompt: 'Finance. A second welding cell would double welding capacity from Monday week 7, for EUR 2,500 a week (lease and
  a second welder). The standard-cost sheet says it raises the unit cost of everything we weld. Should we take it? Write plans/2026-w06-weld-cell.md
  with a line DECISION: yes or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w06-weld-cell.md
- type: file_regex
  path: plans/2026-w06-weld-cell.md
  regex: (?i)DECISION:\s*\**\s*yes\b
  rule: T8
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w06-weld-cell.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T8
    do:
      builtin: doc
      line: 'DECISION: yes'
    naive:
      builtin: doc
      line: 'DECISION: no'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: investment
