id: w07-late
title: Week 7 late order
manager: sales
week: 7
date: '2026-05-20'
groups:
- 2
- 9
- 11
prompt: 'Sales. Halden Ltd asks why their order O-0751 (50 EN, due 2026-05-13) is late. Write them a reply with a line HELD-AT:
  <work centre> saying where it is held up.'
feedback: true
checks:
- type: mail_to
  to: buyer@halden.example
  folder: any
- type: new_text_regex
  regex: 'HELD-AT:'
- type: labelled_centre
  label: HELD-AT
  rule: T1
- type: no_external_send
  internal: '@plant.example'
  rule: P01
fake:
  steps:
  - rule: T1
    fact: paint
    do:
      builtin: set
      name: held
      value: '{constraint}'
    naive:
      builtin: set
      name: held
      value: cut
    stale:
      builtin: set
      name: held
      value: weld
  - rule: P01
    do:
      builtin: say
      tool: mail_draft
      arguments:
        to: buyer@halden.example
        subject: Your order O-0751
        body: |-
          Your order is waiting for painting capacity.
          HELD-AT: {held}
    naive:
      builtin: say
      tool: mail_send
      arguments:
        to: buyer@halden.example
        subject: Your order O-0751
        body: |-
          Your order is held up.
          HELD-AT: {held}
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: customer
seed:
  inbox:
  - id: in-w07-late
    from: buyer@halden.example
    to: me
    subject: Order O-0751?
    body: Our order O-0751 was due 2026-05-13. Where is it?
