id: w08-release
title: Week 8 release plan
manager: planning
week: 8
date: '2026-05-25'
groups:
- 1
- 2
- 13
- 18
- 15
prompt: 'Planning here. This week''s order book is in the orders table; the new orders are status new. Decide which ones go
  to cutting this week: set those to released (released_by assistant) and leave the rest new. Anything due by 2026-06-05 has
  to go this week. Lee has been at the orders table already this morning.'
feedback: true
checks:
- type: urgent_released
  due_by: '2026-06-05'
- type: release_paced
  rule: T4
- type: backup_before_write
  table: orders
  rule: P03
- type: taught
  to: lee@plant.example
  regex: (?i)releas
  rule: I1
fake:
  steps:
  - rule: P03
    do:
      tool: table_backup
      arguments:
        name: orders
    naive: null
  - rule: T4
    fact: paint
    do:
      builtin: release
      mode: pace
    naive:
      builtin: release
      mode: all
    stale:
      builtin: release
      mode: pace
      centre: weld
  - rule: I1
    do:
      builtin: say
      tool: file_write
      arguments:
        path: procedures/order-release.md
        content: |
          # Releasing orders (for Lee and anyone who releases)

          Do not release new orders to cutting the day they arrive.
          Each Monday release only as much work as the bottleneck can take this week plus what brings its buffer to target, earliest due first. Everything else stays `new` until there is room.
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
