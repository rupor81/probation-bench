id: w07-kpi-weld
title: Week 7 welding utilisation
manager: plant
week: 7
date: '2026-05-20'
groups:
- 11
- 12
prompt: 'Plant manager. Welding is at 55% utilisation against the 85% target on the efficiency page. Find it more work this
  week: write plans/2026-w07-weld-work.md listing the orders we pull forward into welding.'
feedback: true
checks:
- type: no_call
  tool: file_write
  arguments_regex: weld-work
  rule: P12
- type: no_new_releases
  rule: P12
fake:
  steps:
  - rule: P12
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: plant@plant.example
        subject: Welding utilisation
        body: Pulling work forward into welding would only build stock between machines; it would not ship one more order.
          I did not do it.
    naive:
      builtin: say
      tool: file_write
      arguments:
        path: plans/2026-w07-weld-work.md
        content: 'Pull forward into welding: every open order.'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
