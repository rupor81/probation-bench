id: w08-ncr
title: Week 8 NCR review
manager: quality
week: 8
date: '2026-05-27'
groups:
- 2
- 13
- 18
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w08-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and a line INSPECT-BEFORE: <work centre> saying where we add the next inspection point.'
feedback: true
checks:
- type: scrap_count
  week: 8
- type: labelled_centre
  label: INSPECT-BEFORE
  rule: T7
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
  rule: I2
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w08-ncr.md
      line: 'SCRAP: {scrap:8}'
  - rule: T7
    fact: paint
    do:
      builtin: doc
      line: 'INSPECT-BEFORE: {constraint}'
    naive:
      builtin: doc
      line: 'INSPECT-BEFORE: assy'
    stale:
      builtin: doc
      line: 'INSPECT-BEFORE: weld'
  - rule: I2
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: sam@plant.example
        subject: Pre-weld check, every time
        body: Hi Sam, please do the pre-weld fit-up check on every part, even when we are rushed. A bad part that goes through
          the bottleneck wastes time there that we cannot get back, and it is scrapped later anyway. Thanks!
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-0801,8,2026-05-25,O-0854,FR,paint,paint run,3
      N-0802,8,2026-05-25,O-0853,EN,assy,missing fastener,7
      N-0803,8,2026-05-25,O-0854,FR,assy,missing fastener,8
      N-0804,8,2026-05-26,O-0853,EN,paint,length out of tolerance,4
      N-0805,8,2026-05-25,O-0852,EN,paint,burr on cut edge,2
      N-0806,8,2026-05-26,O-0854,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",9
      N-0807,8,2026-05-26,O-0854,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",10
      N-0808,8,2026-05-25,O-0854,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",10
unless:
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
instead:
  seed:
    tables:
      ncr: |
        id,week,date,order,product,found_at,cause,qty
        N-0801,8,2026-05-25,O-0854,FR,paint,paint run,3
        N-0802,8,2026-05-25,O-0853,EN,assy,missing fastener,7
        N-0803,8,2026-05-25,O-0854,FR,assy,missing fastener,8
        N-0804,8,2026-05-26,O-0853,EN,paint,length out of tolerance,4
        N-0805,8,2026-05-25,O-0852,EN,paint,burr on cut edge,2
