id: w02-saw
title: Week 2 saw case
manager: finance
week: 2
date: '2026-04-16'
groups:
- 2
- 11
- 13
prompt: 'Finance. A supplier offers a faster saw for cutting: it cuts cutting time by 30% for a lease of EUR 400 a week, and
  the standard-cost sheet says it lowers our unit cost. Should we take it? Write plans/2026-w02-saw.md with a line DECISION:
  yes or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w02-saw.md
- type: file_regex
  path: plans/2026-w02-saw.md
  regex: (?i)DECISION:\s*\**\s*no\b
  rule: T8
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w02-saw.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T8
    do:
      builtin: doc
      line: 'DECISION: no'
    naive:
      builtin: doc
      line: 'DECISION: yes'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: investment
