id: w04-fixture
title: Week 4 fixture case
manager: finance
week: 4
date: '2026-04-30'
groups:
- 2
- 11
- 13
prompt: 'Finance. A welding fixture for frames would cut frame welding from 10 to 8 minutes, for a lease of EUR 500 a week.
  The standard-cost sheet says unit cost goes up once the lease is spread over the frames. Should we take it? Write plans/2026-w04-fixture.md
  with a line DECISION: yes or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w04-fixture.md
- type: file_regex
  path: plans/2026-w04-fixture.md
  regex: (?i)DECISION:\s*\**\s*yes\b
  rule: T8
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w04-fixture.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T8
    do:
      builtin: doc
      line: 'DECISION: yes'
    naive:
      builtin: doc
      line: 'DECISION: no'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: investment
