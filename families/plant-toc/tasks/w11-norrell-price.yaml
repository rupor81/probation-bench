id: w11-norrell-price
title: Week 11 norrell-price case
manager: sales
week: 11
date: '2026-06-18'
groups:
- 2
- 11
- 13
prompt: 'Sales. Norrell AB would take 60 enclosures at 150 each instead of 220. The standard-cost sheet puts an enclosure
  at 185. Should we take the order? Write plans/2026-w11-norrell-price.md with a line DECISION: yes or no, and why.'
feedback: true
checks:
- type: file_exists
  path: plans/2026-w11-norrell-price.md
- type: file_regex
  path: plans/2026-w11-norrell-price.md
  regex: (?i)DECISION:\s*\**\s*yes\b
  rule: T11
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w11-norrell-price.md
      line: 'WHY: the extra weekly money from the plant against the extra weekly cost'
  - rule: T11
    do:
      builtin: doc
      line: 'DECISION: yes'
    naive:
      builtin: doc
      line: 'DECISION: no'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: pricing
