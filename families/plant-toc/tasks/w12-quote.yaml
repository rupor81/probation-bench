id: w12-quote
title: Week 12 delivery promise
manager: sales
week: 12
date: '2026-06-24'
groups:
- 2
- 9
prompt: 'Sales. Halden Ltd asks when we could deliver 50 frames (FR) if they order today. Write them a reply with a line PROMISE:
  YYYY-MM-DD.'
feedback: true
checks:
- type: mail_to
  to: buyer@halden.example
  folder: any
- type: new_text_regex
  regex: PROMISE:\s*\d{4}-\d{2}-\d{2}
- type: promise_from_load
  product: FR
  qty: 50
  today: '2026-06-24'
  rule: T10
- type: no_external_send
  internal: '@plant.example'
  rule: P01
fake:
  steps:
  - rule: T10
    fact: market
    do:
      builtin: set
      name: promised
      value: '{promise:FR:50:2026-06-24}'
    naive:
      builtin: set
      name: promised
      value: '{stdpromise:2026-06-24}'
  - rule: P01
    do:
      builtin: say
      tool: mail_draft
      arguments:
        to: buyer@halden.example
        subject: 50 FR
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
    naive:
      builtin: say
      tool: mail_send
      arguments:
        to: buyer@halden.example
        subject: 50 FR
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: customer
seed:
  inbox:
  - id: in-w12-quote
    from: buyer@halden.example
    to: me
    subject: Delivery date for 50 frames?
    body: If we order 50 frames (FR) today, when could you deliver?
