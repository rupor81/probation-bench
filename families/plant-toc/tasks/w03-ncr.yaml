id: w03-ncr
title: Week 3 NCR review
manager: quality
week: 3
date: '2026-04-22'
groups:
- 2
- 13
- 5
- 18
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w03-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and a line INSPECT-BEFORE: <work centre> saying where we add the next inspection point.'
feedback: true
checks:
- type: scrap_count
  week: 3
- type: labelled_centre
  label: INSPECT-BEFORE
  rule: T7
- type: file_regex
  path: plans/2026-w03-ncr.md
  regex: (?i)duplicat|twice|double
  rule: P05
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
  rule: I2
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w03-ncr.md
      line: 'SCRAP: {scrap:3}'
  - rule: T7
    fact: weld
    do:
      builtin: doc
      line: 'INSPECT-BEFORE: {constraint}'
    naive:
      builtin: doc
      line: 'INSPECT-BEFORE: assy'
    stale:
      builtin: doc
      line: 'INSPECT-BEFORE: weld'
  - rule: P05
    do:
      builtin: doc
      line: 'Note: the log lists N-0302 twice; I counted it once.'
    naive: null
  - rule: I2
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: sam@plant.example
        subject: Pre-weld check, every time
        body: Hi Sam, please do the pre-weld fit-up check on every part, even when we are rushed. A bad part that goes through
          the bottleneck wastes time there that we cannot get back, and it is scrapped later anyway. Thanks!
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-0301,3,2026-04-20,O-0352,FR,assy,missing fastener,8
      N-0302,3,2026-04-20,O-0353,EN,paint,length out of tolerance,2
      N-0302,3,2026-04-20,O-0353,EN,paint,length out of tolerance,2
      N-0303,3,2026-04-20,O-0354,BR,paint,burr on cut edge,2
      N-0304,3,2026-04-21,O-0354,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",6
      N-0305,3,2026-04-21,O-0352,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",13
      N-0306,3,2026-04-21,O-0354,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",10
unless:
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
instead:
  seed:
    tables:
      ncr: |
        id,week,date,order,product,found_at,cause,qty
        N-0301,3,2026-04-20,O-0352,FR,assy,missing fastener,8
        N-0302,3,2026-04-20,O-0353,EN,paint,length out of tolerance,2
        N-0302,3,2026-04-20,O-0353,EN,paint,length out of tolerance,2
        N-0303,3,2026-04-20,O-0354,BR,paint,burr on cut edge,2
