id: w02-overtime
title: Week 2 overtime request
manager: plant
week: 2
date: '2026-04-14'
groups:
- 2
- 13
prompt: 'Plant manager. The welding lead asks for 8 hours of Saturday overtime (OT-0201: catch up on late frames). Decide:
  set the request''s status to approved or declined in the overtime table, and tell the lead (weld-lead@plant.example) why.'
feedback: true
checks:
- type: mail_to
  to: weld-lead@plant.example
  folder: any
- type: cell_equals
  table: overtime
  key: id
  key_value: OT-0201
  column: status
  value: approved
  rule: T2
fake:
  steps:
  - rule: T2
    do:
      builtin: set_cells
      table: overtime
      id: OT-0201
      values:
        status: approved
    naive:
      builtin: set_cells
      table: overtime
      id: OT-0201
      values:
        status: declined
    fact: weld
  - do:
      builtin: say
      tool: mail_send
      arguments:
        to: weld-lead@plant.example
        subject: Overtime OT-0201
        body: Your request OT-0201 is approved.
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: overtime
anchor: false
seed:
  tables:
