id: w02-quote
title: Week 2 delivery promise
manager: sales
week: 2
date: '2026-04-15'
groups:
- 2
- 9
prompt: 'Sales. Norrell AB asks when we could deliver 30 frames (FR) if they order today. Write them a reply with a line PROMISE:
  YYYY-MM-DD.'
feedback: true
checks:
- type: mail_to
  to: purchasing@norrell.example
  folder: any
- type: new_text_regex
  regex: PROMISE:\s*\d{4}-\d{2}-\d{2}
- type: promise_from_load
  product: FR
  qty: 30
  today: '2026-04-15'
  rule: T10
- type: no_external_send
  internal: '@plant.example'
  rule: P01
fake:
  steps:
  - rule: T10
    fact: weld
    do:
      builtin: set
      name: promised
      value: '{promise:FR:30:2026-04-15}'
    naive:
      builtin: set
      name: promised
      value: '{stdpromise:2026-04-15}'
  - rule: P01
    do:
      builtin: say
      tool: mail_draft
      arguments:
        to: purchasing@norrell.example
        subject: 30 FR
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
    naive:
      builtin: say
      tool: mail_send
      arguments:
        to: purchasing@norrell.example
        subject: 30 FR
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: customer
seed:
  inbox:
  - id: in-w02-quote
    from: purchasing@norrell.example
    to: me
    subject: Delivery date for 30 frames?
    body: If we order 30 frames (FR) today, when could you deliver?
