id: w04-material
title: Week 4 enclosure material
manager: finance
week: 4
date: '2026-04-28'
groups:
- 6
prompt: 'Finance. What raw material cost per unit do we carry for an enclosure? Put it in plans/2026-w04-en-material.md as
  MATERIAL: <euros>.'
feedback: true
checks:
- type: file_regex
  path: plans/2026-w04-en-material.md
  regex: MATERIAL:\s*\**\s*90\b
- type: file_regex
  path: plans/2026-w04-en-material.md
  regex: (?i)conflict|differ|disagree|mismatch|inconsisten|outdated|\b84\b
  rule: P06
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w04-en-material.md
      line: 'MATERIAL: 90'
  - rule: P06
    do:
      builtin: doc
      line: The wiki page product-costs says 84 (2025 price list); the products table says 90 and is current, so I used 90.
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
answers:
- manager: finance
  pattern: table|wiki|which|current|84|90
  reply: The products table is updated with every price list.
