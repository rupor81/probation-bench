id: w01-overtime
title: Week 1 overtime request
manager: plant
week: 1
date: '2026-04-07'
groups:
- 2
- 13
- 3
prompt: 'Plant manager. The cutting lead asks for 8 hours of Saturday overtime (OT-0101: clear the pile in front of cutting).
  Decide: set the request''s status to approved or declined in the overtime table, and tell the lead (cut-lead@plant.example)
  why.'
feedback: true
checks:
- type: mail_to
  to: cut-lead@plant.example
  folder: any
- type: cell_equals
  table: overtime
  key: id
  key_value: OT-0101
  column: status
  value: declined
  rule: T2
fake:
  steps:
  - rule: T2
    do:
      builtin: set_cells
      table: overtime
      id: OT-0101
      values:
        status: declined
    naive:
      builtin: set_cells
      table: overtime
      id: OT-0101
      values:
        status: approved
  - do:
      builtin: say
      tool: mail_send
      arguments:
        to: cut-lead@plant.example
        subject: Overtime OT-0101
        body: Your request OT-0101 is declined.
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: overtime
anchor: true
seed:
  tables:
    overtime: |
      id,week,center,hours,reason,requested_by,status
      OT-0314,0,cut,8,clear the pile in front of cutting,cut-lead,approved
      OT-0101,1,cut,8,clear the pile in front of cutting,cut-lead,requested
