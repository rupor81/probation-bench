id: w01-ncr
title: Week 1 NCR review
manager: quality
week: 1
date: '2026-04-08'
groups:
- 2
- 13
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w01-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and a line INSPECT-BEFORE: <work centre> saying where we add the next inspection point.'
feedback: true
checks:
- type: scrap_count
  week: 1
- type: labelled_centre
  label: INSPECT-BEFORE
  rule: T7
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w01-ncr.md
      line: 'SCRAP: {scrap:1}'
  - rule: T7
    fact: weld
    do:
      builtin: doc
      line: 'INSPECT-BEFORE: {constraint}'
    naive:
      builtin: doc
      line: 'INSPECT-BEFORE: assy'
    stale:
      builtin: doc
      line: 'INSPECT-BEFORE: weld'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-0101,1,2026-04-06,O-0153,FR,assy,missing fastener,7
      N-0102,1,2026-04-06,O-0153,FR,assy,missing fastener,7
      N-0103,1,2026-04-07,O-0153,FR,paint,paint run,2
      N-0104,1,2026-04-06,O-0153,FR,paint,paint run,7
      N-0105,1,2026-04-07,O-0152,EN,paint,length out of tolerance,2
      N-0106,1,2026-04-06,O-0155,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",9
