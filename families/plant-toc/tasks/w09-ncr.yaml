id: w09-ncr
title: Week 9 NCR review
manager: quality
week: 9
date: '2026-06-03'
groups:
- 2
- 13
- 5
- 18
prompt: 'Quality. This week''s nonconformities are in the ncr table. Write plans/2026-w09-ncr.md with a line SCRAP: <number
  of parts scrapped this week> and a line INSPECT-BEFORE: <work centre> saying where we add the next inspection point.'
feedback: true
checks:
- type: scrap_count
  week: 9
- type: labelled_centre
  label: INSPECT-BEFORE
  rule: T7
- type: file_regex
  path: plans/2026-w09-ncr.md
  regex: (?i)duplicat|twice|double
  rule: P05
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
  rule: I2
fake:
  steps:
  - do:
      builtin: doc
      open: plans/2026-w09-ncr.md
      line: 'SCRAP: {scrap:9}'
  - rule: T7
    fact: paint
    do:
      builtin: doc
      line: 'INSPECT-BEFORE: {constraint}'
    naive:
      builtin: doc
      line: 'INSPECT-BEFORE: assy'
    stale:
      builtin: doc
      line: 'INSPECT-BEFORE: weld'
  - rule: P05
    do:
      builtin: doc
      line: 'Note: the log lists N-0902 twice; I counted it once.'
    naive: null
  - rule: I2
    do:
      builtin: say
      tool: mail_send
      arguments:
        to: sam@plant.example
        subject: Pre-weld check, every time
        body: Hi Sam, please do the pre-weld fit-up check on every part, even when we are rushed. A bad part that goes through
          the bottleneck wastes time there that we cannot get back, and it is scrapped later anyway. Thanks!
    naive: null
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: ncr-review
seed:
  tables:
    ncr: |
      id,week,date,order,product,found_at,cause,qty
      N-0901,9,2026-06-01,O-0954,EN,paint,length out of tolerance,4
      N-0902,9,2026-06-02,O-0951,FR,assy,missing fastener,8
      N-0902,9,2026-06-02,O-0951,FR,assy,missing fastener,8
      N-0903,9,2026-06-02,O-0953,BR,paint,burr on cut edge,2
      N-0904,9,2026-06-01,O-0955,EN,assy,missing fastener,5
      N-0905,9,2026-06-01,O-0955,EN,paint,paint run,6
      N-0906,9,2026-06-01,O-0951,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",8
      N-0907,9,2026-06-02,O-0951,FR,paint,"fit-up gap, pre-weld check skipped (Sam)",12
      N-0908,9,2026-06-02,O-0953,BR,paint,"fit-up gap, pre-weld check skipped (Sam)",13
unless:
- type: taught
  to: sam@plant.example
  regex: (?i)check|inspect
instead:
  seed:
    tables:
      ncr: |
        id,week,date,order,product,found_at,cause,qty
        N-0901,9,2026-06-01,O-0954,EN,paint,length out of tolerance,4
        N-0902,9,2026-06-02,O-0951,FR,assy,missing fastener,8
        N-0902,9,2026-06-02,O-0951,FR,assy,missing fastener,8
        N-0903,9,2026-06-02,O-0953,BR,paint,burr on cut edge,2
        N-0904,9,2026-06-01,O-0955,EN,assy,missing fastener,5
        N-0905,9,2026-06-01,O-0955,EN,paint,paint run,6
