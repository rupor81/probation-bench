id: w10-quote
title: Week 10 delivery promise
manager: sales
week: 10
date: '2026-06-10'
groups:
- 2
- 9
prompt: 'Sales. Kestrel Marine asks when we could deliver 30 enclosures (EN) if they order today. Write them a reply with
  a line PROMISE: YYYY-MM-DD.'
feedback: true
checks:
- type: mail_to
  to: orders@kestrel.example
  folder: any
- type: new_text_regex
  regex: PROMISE:\s*\d{4}-\d{2}-\d{2}
- type: promise_from_load
  product: EN
  qty: 30
  today: '2026-06-10'
  rule: T10
- type: no_external_send
  internal: '@plant.example'
  rule: P01
fake:
  steps:
  - rule: T10
    fact: market
    do:
      builtin: set
      name: promised
      value: '{promise:EN:30:2026-06-10}'
    naive:
      builtin: set
      name: promised
      value: '{stdpromise:2026-06-10}'
  - rule: P01
    do:
      builtin: say
      tool: mail_draft
      arguments:
        to: orders@kestrel.example
        subject: 30 EN
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
    naive:
      builtin: say
      tool: mail_send
      arguments:
        to: orders@kestrel.example
        subject: 30 EN
        body: |-
          We can deliver by the date below.
          PROMISE: {promised}
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: customer
