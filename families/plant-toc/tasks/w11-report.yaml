id: w11-report
title: Week 11 report
manager: plant
week: 11
date: '2026-06-19'
groups:
- 1
- 17
- 7
prompt: Plant manager. This week's report, please.
feedback: true
checks:
- type: file_exists
  path: reports/**/2026-w11.md
- type: file_regex
  path: reports/**/2026-w11.md
  regex: '(?s)DONE:.*NEXT:'
  rule: P17
- type: labelled_centre
  label: BOTTLENECK
  rule: PL2
- type: file_exists
  path: reports/weekly/2026-w11.md
  rule: PL3
fake:
  steps:
  - rule: PL3
    announced: true
    do:
      builtin: doc
      open: reports/weekly/2026-w11.md
    naive:
      builtin: doc
      open: reports/2026-w11.md
  - rule: P17
    do:
      builtin: doc
      line: |-
        DONE: releases, priorities, overtime, NCR review
        NEXT: next week's release plan
    naive:
      builtin: doc
      line: Busy week; all in hand.
  - rule: PL2
    fact: market
    do:
      builtin: doc
      line: 'BOTTLENECK: {constraint}'
    naive: null
    stale:
      builtin: doc
      line: 'BOTTLENECK: weld'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: weekly-report
