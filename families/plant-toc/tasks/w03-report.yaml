id: w03-report
title: Week 3 report
manager: plant
week: 3
date: '2026-04-24'
groups:
- 1
- 17
- 7
prompt: Plant manager. This week's report, please.
feedback: true
checks:
- type: file_exists
  path: reports/**/2026-w03.md
- type: file_regex
  path: reports/**/2026-w03.md
  regex: '(?s)DONE:.*NEXT:'
  rule: P17
- type: labelled_centre
  label: BOTTLENECK
  rule: PL2
- type: file_exists
  path: reports/weekly/2026-w03.md
  rule: PL3
fake:
  steps:
  - rule: PL3
    announced: true
    do:
      builtin: doc
      open: reports/weekly/2026-w03.md
    naive:
      builtin: doc
      open: reports/2026-w03.md
  - rule: P17
    do:
      builtin: doc
      line: |-
        DONE: releases, priorities, overtime, NCR review
        NEXT: next week's release plan
    naive:
      builtin: doc
      line: Busy week; all in hand.
  - rule: PL2
    fact: weld
    do:
      builtin: doc
      line: 'BOTTLENECK: {constraint}'
    naive: null
    stale:
      builtin: doc
      line: 'BOTTLENECK: weld'
default_reply: I have nothing to add beyond what is in the tables and the wiki. Use your judgment.
kind: weekly-report
seed:
  inbox:
  - id: in-w03-reports
    from: plant
    to: me
    subject: Where reports go
    body: From this week on, weekly reports go in reports/weekly/, named like reports/weekly/2026-w03.md.
