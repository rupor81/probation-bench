    - type: bant
      account: vantage
      rule: S4
    - type: contacts
      account: vantage
      at_least: 2
      rule: S5
    - type: logged
      account: vantage
      'on': '2026-06-12'
      rule: S8
    steps:
    - rule: S6
      do:
        tool: mail_send
        arguments:
          to: dana.whitfield@vantage.example
          subject: Northwind proposal
          body: |-
            Here is our proposal for your fleet.
            VEHICLES: 30
            PRICE: 18.00
            DISCOUNT: 10
            TERM: 12 months
            Hardware and installation are included.
