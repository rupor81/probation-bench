    checks:
    - type: mailed
      to: luis
      'on': '2026-06-17'
      direct: true
    - type: logged
      account: ortega
      'on': '2026-06-17'
      rule: S8
    steps:
    - do:
        tool: mail_send
        arguments:
          to: luis.ortega@ortega.example
          subject: Fleet tracking for Ortega Logistics
