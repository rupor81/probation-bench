- id: B-touch-check
  cases:
  - name: gone
    when:
    - type: inbox_has
      id: (lost|slipped)-B
  - name: live
    when:
    - type: inbox_has
      id: B3
    checks:
    - type: mailed
      to: ortega
      since: '2026-06-16'
      until: '2026-06-17'
      folder: any
      written: true
      rule: S2
    steps: []
  - name: 'off'
- id: B-B4
  cases:
  - name: earlier
    when:
    - type: inbox_has
      id: B4
  - name: gone
    when:
    - type: inbox_has
      id: (lost|slipped)-B
  - name: now
    when:
    - type: inbox_has
      id: B3
    - type: mailed
      to: marta
      since: '2026-06-16'
      until: '2026-06-16'
    seed:
      inbox:
      - id: B4
        date: '2026-06-17'
        from: marta.ruiz@ortega.example
        to: me
        subject: Automatic reply
