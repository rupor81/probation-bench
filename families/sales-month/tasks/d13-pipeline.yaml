  - name: gone
    when:
    - type: inbox_has
      id: (lost|slipped)-C
  - name: slipped
    when:
    - type: inbox_has
      id: C3
    - type: inbox_has
      id: C4
      not: true
    seed:
      inbox:
      - id: slipped-C
        date: '2026-06-17'
        from: dana.whitfield@vantage.example
        to: me
        subject: Proposal
        body: We never got the proposal. Let us talk again next quarter.
  - name: fine
- id: C-question
  cases:
  - name: gone
    when:
    - type: inbox_has
      id: (lost|slipped)-C
  - name: asked
    when:
    - type: inbox_has
      id: C4
    seed:
      inbox:
      - id: C-question
        date: '2026-06-17'
        from: dana.whitfield@vantage.example
        to: me
        subject: Quick question
        body: 'Before our review: does your tracker work with Ford Transit vans? I need to know today.'
